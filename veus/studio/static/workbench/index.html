<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="VEUS Electric Vehicle Engineering Workbench — understand, design, simulate and optimize."
    />
    <title>VEUS — Electric Vehicle Engineering Workbench</title>
    <link rel="icon" href="/static/workbench/mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/workbench/workbench.css" />
    <link rel="stylesheet" href="/static/workbench/vehicle.css" />
  </head>
  <body data-workspace="anatomy">
    <a class="skip-link" href="#workspace-content">Skip to workspace</a>
    <header class="topbar">
      <a href="/?workspace=anatomy" class="brand" aria-label="VEUS home"
        >V<span>∕</span>EUS<span class="brand-note"
          >ELECTRIC VEHICLE<br />ENGINEERING WORKBENCH</span
        ></a
      >
      <div class="edition">
        <span class="status-dot"></span> 2.3 SIMULATION LAB
        <span class="edition-note"
          >Understand · Design · Simulate · Optimize</span
        >
      </div>
      <button
        id="theme-toggle"
        class="theme-toggle"
        aria-label="Switch to dark theme"
      >
        ◐ <span>Dark</span>
      </button>
    </header>
    <main id="workspace-content" tabindex="-1">
      <div id="loading" role="status">Loading engineering workspace…</div>
      <div id="workspace-host"></div>
    </main>
    <nav class="workspace-dock" aria-label="Engineering workspaces">
      <div id="workspace-tabs" role="tablist" aria-label="Workspaces"></div>
    </nav>
    <div id="notice" class="notice" role="status" aria-live="polite"></div>
    <script type="module" src="/static/workbench/app.js"></script>
  </body>
</html>
